<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" role="img" aria-label="Web Buildr logo">
  <defs>
    <linearGradient id="webPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f564c8" />
      <stop offset="100%" stop-color="#ff9bb4" />
    </linearGradient>
    <linearGradient id="buildrPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc5a9" />
      <stop offset="100%" stop-color="#f49bb1" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#555" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="1366" height="768" fill="#000" />

  <g filter="url(#logoShadow)" font-family="Arial Rounded MT Bold, Trebuchet MS, Arial Black, sans-serif" font-weight="900" stroke="#fff" stroke-linejoin="round">
    <text x="100" y="430" fill="url(#webPink)" stroke-width="9" font-size="245" letter-spacing="-18">WEB</text>
    <text x="605" y="505" fill="url(#buildrPink)" stroke-width="7" font-size="132" letter-spacing="-4">BUILDR</text>
  </g>

  <path d="M1070 205 1090 270 1158 270 1103 310 1123 375 1070 337 1017 375 1037 310 982 270 1050 270Z"
        fill="url(#buildrPink)" stroke="#fff" stroke-width="8" stroke-linejoin="round" filter="url(#logoShadow)" />
</svg>